appId: "com.crewora.offline"
productName: "Crewora Offline"
directories:
  output: "release"
files:
  - "dist/**/*"
  - "backend/**/*"
  - "electron/**/*"
extraResources:
  - from: "backend"
    to: "app/backend"
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
